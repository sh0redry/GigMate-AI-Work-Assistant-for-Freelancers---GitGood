name: Desktop release
on:
  push:
    tags: ['v*-desktop*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (v*-desktop*)'
        required: true
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - id: source
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[A-Za-z0-9._-]*-desktop[A-Za-z0-9._-]*$ ]]
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.9
        env:
          POSTGRES_USER: gigmate
          POSTGRES_PASSWORD: desktop-ci-only
          POSTGRES_DB: gigmate
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gigmate -d gigmate"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PYTHONPATH: apps/backend/src
      DATABASE_URL: postgresql+psycopg://gigmate:desktop-ci-only@127.0.0.1:5432/gigmate
      TEST_DATABASE_URL: postgresql+psycopg://gigmate:desktop-ci-only@127.0.0.1:5432/gigmate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - run: pip install -r apps/backend/requirements.lock
      - run: python scripts/export_contracts.py --check
      - run: python scripts/check_baseline.py
      - run: alembic -c apps/backend/alembic.ini upgrade head
      - run: alembic -c apps/backend/alembic.ini check
      - run: pytest apps/backend/tests -q
      - run: python -m pytest scripts/test_desktop_checksums.py -q
  package:
    name: Desktop (${{ matrix.os }}, ${{ matrix.arch }})
    needs: [resolve, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            target: mac
          - os: macos-latest
            arch: x64
            target: mac
          - os: windows-latest
            arch: x64
            target: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m venv .venv
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run check:api && npm run format:check && npm run build
        working-directory: apps/web
      - run: npm ci
        working-directory: apps/desktop
      - run: npm test && npm run prepare:runtime
        working-directory: apps/desktop
      - run: npm run dist -- --${{ matrix.target }} --${{ matrix.arch }}
        working-directory: apps/desktop
      - name: Record exact source
        shell: bash
        run: git rev-parse HEAD > apps/desktop/dist/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GigMate-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/SOURCE_COMMIT.txt
          if-no-files-found: error
  publish:
    needs: [resolve, validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v4
        with:
          pattern: GigMate-*
          path: release-assets
          merge-multiple: true
      - name: Generate and verify installer checksums
        run: |
          test "$(cat release-assets/SOURCE_COMMIT.txt)" = "$(git rev-parse HEAD)"
          python scripts/desktop_checksums.py release-assets
          cd release-assets && sha256sum -c SHA256SUMS.txt
      - name: Upload verified assets to existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$SOURCE_SHA"
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY"
