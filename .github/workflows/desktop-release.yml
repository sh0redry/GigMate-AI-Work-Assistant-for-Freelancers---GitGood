name: Desktop release
on:
  push:
    tags: ['v*-desktop*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (v*-desktop*)'
        required: true
permissions:
  contents: write
jobs:
  package:
    name: Desktop (${{ matrix.os }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            target: mac
          - os: macos-latest
            arch: x64
            target: mac
          - os: windows-latest
            arch: x64
            target: win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m venv .venv
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run check:api && npm run format:check && npm run build
        working-directory: apps/web
      - run: npm ci
        working-directory: apps/desktop
      - run: npm test && npm run prepare:runtime
        working-directory: apps/desktop
      - run: npm run dist -- --${{ matrix.target }} --${{ matrix.arch }}
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: GigMate-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
          if-no-files-found: error
      - name: Upload installers to draft release
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" apps/desktop/dist/*.${{ matrix.target == 'win' && 'exe' || 'dmg' }} --repo "$GITHUB_REPOSITORY" --clobber
          if [ "${{ matrix.target }}" = "mac" ]; then
            gh release upload "$RELEASE_TAG" apps/desktop/dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          fi
