name: Replay skeleton

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  desktop-safety:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - run: node --test apps/desktop/*.test.cjs
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12.10'
      - run: python scripts/check_desktop_preview.py --browser google-chrome
        if: runner.os == 'Linux'
  pdf-isolation:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONPATH: apps/backend/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: pip install -r apps/backend/requirements.lock
      - run: pytest apps/backend/tests/test_pdf_isolation.py -q
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.9
        env:
          POSTGRES_USER: gigmate
          POSTGRES_PASSWORD: local-replay-only
          POSTGRES_DB: gigmate
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gigmate -d gigmate"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PYTHONPATH: apps/backend/src
      DATABASE_URL: postgresql+psycopg://gigmate:local-replay-only@127.0.0.1:5432/gigmate
      TEST_DATABASE_URL: postgresql+psycopg://gigmate:local-replay-only@127.0.0.1:5432/gigmate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: pip install -r apps/backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - run: ruff check apps/backend scripts/export_contracts.py scripts/smoke_replay.py scripts/run_evaluation.py scripts/smoke_deepseek.py scripts/smoke_media.py
      - run: ruff format --check apps/backend scripts/export_contracts.py scripts/smoke_replay.py scripts/run_evaluation.py scripts/smoke_deepseek.py scripts/smoke_media.py
      - run: python scripts/export_contracts.py --check
      - run: python scripts/check_baseline.py
      - run: python -m pytest scripts/test_desktop_checksums.py -q
      - run: alembic -c apps/backend/alembic.ini upgrade head
      - run: alembic -c apps/backend/alembic.ini check
      - run: pytest apps/backend/tests -q
  frontend_platforms:
    name: frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m venv .venv
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run check:api
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run format:check
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: frontend_platforms
    if: ${{ always() }}
    steps:
      - run: test "${{ needs.frontend_platforms.result }}" = "success"
