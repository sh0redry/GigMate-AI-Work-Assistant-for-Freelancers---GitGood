[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gigmate-backend"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.135.1", "pydantic==2.13.4", "SQLAlchemy==2.0.48",
  "alembic==1.18.4", "psycopg[binary]==3.3.3", "uvicorn==0.41.0",
  "jsonschema==4.26.0", "pypdf==6.20.0",
  # Used directly by the LLM extraction and media vendor adapters; declared
  # explicitly so it cannot disappear as a transitive dependency.
  "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../.."]
# A wedged test (row-lock wait, thread that never joins) dumps every thread's
# stack and exits instead of hanging the CI job until the platform timeout.
# No single case is anywhere near this bound; raise it only with evidence.
faulthandler_timeout = 300

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
