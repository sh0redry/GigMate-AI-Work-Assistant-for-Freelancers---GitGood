[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gigmate-backend"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.135.1", "pydantic==2.13.4", "SQLAlchemy==2.0.48",
  "alembic==1.18.4", "psycopg[binary]==3.3.3", "uvicorn==0.41.0",
  "jsonschema==4.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../.."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
