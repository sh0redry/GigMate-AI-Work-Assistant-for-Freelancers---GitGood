# Optional B text runtime overlay. Real calls remain off until both explicit gates
# and reviewed operator pricing are set in a private, ignored environment file.
x-text-env: &text-env
  GIGMATE_EXTRACTION_PROVIDER: ${GIGMATE_EXTRACTION_PROVIDER:-deterministic}
  GIGMATE_LLM_PROVIDER: ${GIGMATE_LLM_PROVIDER:-}
  GIGMATE_LLM_MODEL: ${GIGMATE_LLM_MODEL:-}
  GIGMATE_LLM_API_KEY: ${GIGMATE_LLM_API_KEY:-}
  GIGMATE_LLM_ENDPOINT: ${GIGMATE_LLM_ENDPOINT:-}
  GIGMATE_LLM_LIVE: ${GIGMATE_LLM_LIVE:-0}
  GIGMATE_LLM_ALLOW_LIVE_ORIGIN: ${GIGMATE_LLM_ALLOW_LIVE_ORIGIN:-0}
  GIGMATE_LLM_COST_BUDGET_USD: ${GIGMATE_LLM_COST_BUDGET_USD:-0.10}
  GIGMATE_LLM_COST_INPUT_USD_PER_1K: ${GIGMATE_LLM_COST_INPUT_USD_PER_1K:-}
  GIGMATE_LLM_COST_OUTPUT_USD_PER_1K: ${GIGMATE_LLM_COST_OUTPUT_USD_PER_1K:-}
  GIGMATE_LLM_MAX_INPUT_TOKENS: ${GIGMATE_LLM_MAX_INPUT_TOKENS:-16000}
  GIGMATE_LLM_MAX_OUTPUT_TOKENS: ${GIGMATE_LLM_MAX_OUTPUT_TOKENS:-1000}
  GIGMATE_WORKSPACE_TIMEZONE: ${GIGMATE_WORKSPACE_TIMEZONE:-Asia/Hong_Kong}
services:
  api:
    environment: *text-env
  worker:
    environment: *text-env
