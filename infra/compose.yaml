name: gigmate-replay

x-backend: &backend
  build:
    context: ..
    dockerfile: infra/backend.Dockerfile
  environment:
    APP_MODE: replay
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gigmate}:${POSTGRES_PASSWORD:-local-replay-only}@db:5432/${POSTGRES_DB:-gigmate}
    DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-only-change-me}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:18080,http://127.0.0.1:18080,http://localhost:5173,http://127.0.0.1:5173}

services:
  db:
    image: postgres:17.9
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gigmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-replay-only}
      POSTGRES_DB: ${POSTGRES_DB:-gigmate}
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic -c apps/backend/alembic.ini upgrade head && python -m gigmate.seed"]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *backend
    restart: unless-stopped
    ports: ["127.0.0.1:${API_PORT:-18000}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 15
  worker:
    <<: *backend
    restart: unless-stopped
    command: ["python", "-m", "gigmate.worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    ports: ["127.0.0.1:${WEB_PORT:-18080}:80"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  postgres-data:
