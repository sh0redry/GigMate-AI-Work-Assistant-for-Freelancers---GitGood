# Disposable synthetic-only product-setup acceptance; never mounts live sessions.
name: gigmate-waha-setup-check
services:
  db:
    image: postgres:17.9
    environment:
      POSTGRES_USER: gigmate
      POSTGRES_PASSWORD: synthetic-setup-only
      POSTGRES_DB: gigmate_setup
    ports: ["127.0.0.1:16432:5432"]
    volumes: ["setup-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigmate -d gigmate_setup"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  setup-data:
